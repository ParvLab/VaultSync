name: CI

on:
  push:
    branches: [main, "phase*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy rustfmt
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --check

  build-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --workspace
      - run: cargo build --workspace --release
      - name: Check Wasm build
        run: rustup target add wasm32-unknown-unknown && cargo check -p drift-wasm --target wasm32-unknown-unknown

  test-unit:
    runs-on: ubuntu-latest
    needs: [lint, build-rust]
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -p drift-core --lib

  test-integration:
    runs-on: ubuntu-latest
    needs: [lint, build-rust]
    strategy:
      matrix:
        backend: [memory, sqlite, http]
    steps:
      - uses: actions/checkout@v4
      - name: Run backend conformance tests
        run: cargo test -p drift-conformance --test all_backends -- --nocapture ${{ matrix.backend }}

  test-postgres:
    runs-on: ubuntu-latest
    needs: [lint, build-rust]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Postgres conformance tests
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
        run: cargo test -p drift-conformance --test all_backends -- --nocapture postgres

  test-redis:
    runs-on: ubuntu-latest
    needs: [lint, build-rust]
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Redis conformance tests
        env:
          REDIS_URL: redis://localhost:6379
        run: cargo test -p drift-conformance --test all_backends -- --nocapture redis

  test-chaos:
    runs-on: ubuntu-latest
    needs: [lint, build-rust]
    steps:
      - uses: actions/checkout@v4
      - name: Run chaos tests
        run: cargo test -p drift-core --test chaos

  fuzz-short:
    runs-on: ubuntu-latest
    needs: [lint, build-rust]
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Run short fuzz campaigns
        run: |
          cargo fuzz run crdt_merge -- -max_total_time=15
          cargo fuzz run fuzz_decrypt -- -max_total_time=15
          cargo fuzz run fuzz_oplog_deserialize -- -max_total_time=15
          cargo fuzz run fuzz_ws_frame -- -max_total_time=15

  wasm-pack-verify:
    runs-on: ubuntu-latest
    needs: [lint, build-rust]
    steps:
      - uses: actions/checkout@v4
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM bundle
        run: wasm-pack build crates/drift-wasm
      - name: Verify WASM size is under 5MB
        run: |
          size=$(wc -c < crates/drift-wasm/pkg/drift_wasm_bg.wasm)
          if [ "$size" -gt 5242880 ]; then
            echo "WASM bundle size is $size bytes, exceeding 5MB limit!"
            exit 1
          else
            echo "WASM bundle size is $size bytes, within 5MB limit."
          fi

  benchmarks:
    runs-on: ubuntu-latest
    needs: [lint, build-rust]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Criterion benchmarks
        run: cargo bench -p drift-core 2>&1 | tee bench_output.txt
      - name: Benchmark regression gate (>10% fails build)
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Drift Core
          tool: cargo
          output-file-path: bench_output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "110%"
          fail-on-alert: true
          comment-on-alert: true

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, build-rust]
    steps:
      - uses: actions/checkout@v4
      - name: Build coordinator server
        run: cargo build -p drift-coordinator-server --release
      - name: Start coordinator server
        run: ./target/release/drift-coordinator-server --backend memory --port 9876 &
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM
        run: wasm-pack build crates/drift-wasm --target web
      - name: Install deps
        run: npm ci --prefix sdk
      - name: Install Playwright
        run: npx --prefix sdk playwright install --with-deps chromium
      - name: Run E2E
        run: npm run e2e --prefix sdk
        env:
          CI: true
