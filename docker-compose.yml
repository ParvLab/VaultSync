version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.5.0
    ports:
      - "8474:8474" # admin API
      - "8475:8475" # proxy port
    command: -host 0.0.0.0

  coordinator:
    build:
      context: .
      dockerfile: crates/drift-coordinator-server/Dockerfile
    environment:
      - DRIFT_HOST=0.0.0.0
      - DRIFT_PORT=9876
      - DRIFT_BACKEND=redis
      - DRIFT_DB_URL=redis://redis:6379
    ports:
      - "9876:9876"
    depends_on:
      redis:
        condition: service_healthy

