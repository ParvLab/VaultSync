[package]
name = "drift-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["async-runtime", "telemetry", "storage-sqlite"]
async-runtime = ["dep:tokio"]
telemetry = ["dep:tracing-subscriber", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]
storage-sqlite = ["dep:rusqlite"]

[dependencies]
# CRDT
yrs = "0.19"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Encryption
aead = "0.5"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["reusable_secrets"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

# Storage
rusqlite = { version = "0.31", features = ["bundled"], optional = true }

# Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"], optional = true }
opentelemetry = { version = "0.22", optional = true }
opentelemetry_sdk = { version = "0.22", optional = true }
opentelemetry-otlp = { version = "0.15", optional = true }

# Utilities
thiserror = "1"
uuid = { version = "1", features = ["v4", "js"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync", "macros", "rt", "time"], optional = true }

[dev-dependencies]
proptest = "1"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
