vaultsync-coordinator-redis = { path = "../vaultsync-coordinator-redis" }
vaultsync-coordinator-memory = { path = "../vaultsync-coordinator-memory" }
vaultsync-coordinator-http = { path = "../vaultsync-coordinator-http" }
vaultsync-coordinator-server = { path = "../vaultsync-coordinator-server" }
