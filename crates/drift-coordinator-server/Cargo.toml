[package]
name = "drift-coordinator-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
drift-core = { path = "../drift-core" }
drift-coordinator-sqlite = { path = "../drift-coordinator-sqlite" }
drift-coordinator-redis = { path = "../drift-coordinator-redis" }
drift-coordinator-memory = { path = "../drift-coordinator-memory" }

axum = { version = "0.6", features = ["headers"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.4", features = ["cors", "trace"] }
futures = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled"] }
redis = { version = "0.25", features = ["tokio-comp"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
